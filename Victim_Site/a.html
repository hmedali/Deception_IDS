
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي الأول</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            background: rgba(255,255,255,0.08);
            padding: 50px 35px;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 35px;
            margin-bottom: 20px;
            color: #00d4ff;
        }

        p {
            font-size: 17px;
            line-height: 1.8;
            color: #ddd;
            margin-bottom: 25px;
        }

        button {
            background: #00d4ff;
            color: #141e30;
            border: none;
            padding: 13px 30px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: white;
            transform: scale(1.05);
        }

        #message {
            margin-top: 25px;
            color: #00d4ff;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>أهلاً بك!</h1>

        <p>
            هذا أول موقع إلكتروني لي.
            تم تصميمه باستخدام HTML و CSS و JavaScript.
        </p>

        <button onclick="showMessage()">
            اضغط هنا
        </button>

        <div id="message"></div>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerText =
                "أهلاً بك في موقعي الأول 🚀";
        }
    </script>
