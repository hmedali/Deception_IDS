<!-- 🚨 ShadowTrap Smart Honeytoken (V2.0) 🚨 -->
<script>
    (function(){
        // 🔴 هنا التعديل الجديد: فصلنا الموقع عن نوع الفخ
        const targetSite = "بوابة الشركة (Company Portal)"; 
        const honeytokenType = "فتح أدوات المطور (F12/Inspect)";
        
        const clientApiKey = "ST-DEMO-KEY-2026";
        const shadowTrapApi = "http://127.0.0.1:5000/api/alert";
        let alertTriggered = false;

        function fireTrap() {
            if (alertTriggered) return;
            alertTriggered = true;
            console.warn("ShadowTrap: Suspicious activity detected.");
            
            // 🔴 إرسال البيانات المفصلة للسيرفر
            fetch(shadowTrapApi, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json', 
                    'X-API-Key': clientApiKey 
                },
                body: JSON.stringify({ 
                    target_site: targetSite, 
                    honeytoken_type: honeytokenType 
                })
            }).catch(err => console.error(err));
            
            setTimeout(() => { alertTriggered = false; }, 5000);
        }

        // فخ الكيبورد (F12, Inspect, View Source)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) || (e.ctrlKey && (e.key === 'U' || e.key === 'u'))) {
                fireTrap();
            }
        });

        // فخ الماوس
        setInterval(() => {
            if (window.outerWidth - window.innerWidth > 160 || window.outerHeight - window.innerHeight > 160) {
                fireTrap();
            }
        }, 1000);
    })();
</script>
