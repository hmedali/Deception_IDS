<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Portal | Secure Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f4f7f6;
            --surface: #ffffff;
            --ink: #1e293b;
            --muted: #64748b;
            --primary: #0f172a;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --line: #e2e8f0;
            --danger: #dc2626;
            --shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', Tahoma, sans-serif;
            background-color: var(--bg-main);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .security-badge {
            position: absolute;
            top: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(37, 99, 235, 0.08);
            color: var(--accent);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid rgba(37, 99, 235, 0.15);
        }

        .login-container {
            background-color: var(--surface);
            padding: 45px 35px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 440px;
            text-align: center;
            border: 1px solid var(--line);
            position: relative;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-box {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            color: var(--accent);
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 28px;
            margin: 0 auto 20px;
            box-shadow: 0 10px 20px rgba(37,99,235,0.1);
        }

        .login-container h2 {
            margin: 0 0 8px;
            color: var(--primary);
            font-weight: 800;
            font-size: 24px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--ink);
            font-size: 13px;
            font-weight: 700;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            top: 50%;
            left: 14px;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 14px 13px 42px;
            border: 1px solid var(--line);
            border-radius: 12px;
            font-size: 14px;
            background: #fafafa;
            outline: none;
            transition: all 0.25s ease;
            color: var(--ink);
        }

        .input-group input:focus {
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .login-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 13px;
            width: 100%;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(37,99,235,0.2);
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: var(--accent-hover);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .footer-text {
            margin-top: 25px;
            font-size: 12px;
            color: var(--muted);
            border-top: 1px solid var(--line);
            padding-top: 20px;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translate(-50%, 20px);
            background: var(--primary);
            color: white;
            padding: 11px 22px;
            border-radius: 30px;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s ease;
            z-index: 100;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
    </style>
</head>
<body>

    <div class="security-badge">
        <i class="fa-solid fa-shield-halved"></i> Protected by ShadowTrap
    </div>

    <div class="login-container">
        <div class="logo-box">
            <i class="fa-solid fa-building-shield"></i>
        </div>
        <h2>Corporate Portal</h2>
        <p class="subtitle">Authorized Personnel Only • Secure Gateway</p>
        
        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label>Employee ID</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-id-badge"></i>
                    <input type="text" placeholder="Enter your employee ID" required>
                </div>
            </div>
            <div class="input-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="••••••••••••" required>
                </div>
            </div>
            <button type="submit" class="login-btn">Secure Login</button>
        </form>
        
        <div class="footer-text">
            &copy; 2026 TechCorp Inc. All rights reserved. Secure Gateway v4.2
        </div>
    </div>

    <div class="toast" id="toast">Access Denied: Invalid Credentials</div>

    <!-- ============================================== -->
