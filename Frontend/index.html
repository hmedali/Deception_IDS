<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowTrap - Dashboard</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .dashboard-card {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            text-align: center;
            border-top: 5px solid #3b82f6; /* لون أزرق تقني */
            width: 400px;
        }
        h1 {
            color: #60a5fa;
            margin-bottom: 5px;
            font-size: 28px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .status-badge {
            display: inline-block;
            background-color: #064e3b;
            color: #34d399;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            border: 1px solid #059669;
        }
        .version {
            margin-top: 30px;
            font-size: 12px;
            color: #475569;
        }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <h1>🛡️ ShadowTrap</h1>
        <p>نظام الخداع الأمني المتقدم<br>Adaptive Deception-Based IDS</p>
        
        <div class="status-badge">
            ✅ الربط مع فريق العمل ناجح
        </div>

        <div class="version">
            نسخة تجريبية V0.1 - جاهزون للبرمجة!
        </div>
    </div>

</body>
</html>
